<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskPulse OS - Planificador Diario Inteligente</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pulse: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-200 flex flex-col">

    <!-- Top Navbar -->
    <header class="h-16 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between px-8 z-10 shadow-sm">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-bolt-lightning text-pulse-600 text-2xl"></i>
            <span class="text-xl font-bold tracking-wide">TaskPulse <span class="text-xs px-2 py-0.5 rounded-full bg-pulse-100 dark:bg-pulse-900/40 text-pulse-600 dark:text-pulse-400 font-semibold">OS</span></span>
        </div>
        <div class="flex items-center space-x-4">
            <button onclick="toggleDarkMode()" class="p-2 rounded-xl text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700/50 transition-colors">
                <i id="theme-icon" class="fa-solid fa-moon text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-6 md:p-8 space-y-8 overflow-y-auto">
        
        <!-- Panel de Estado y Progreso Dinámico -->
        <div class="bg-gradient-to-r from-pulse-600 to-emerald-700 rounded-3xl p-6 text-white shadow-lg flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="space-y-2 text-center md:text-left">
                <span id="date-display" class="text-xs uppercase tracking-widest bg-white/20 px-3 py-1 rounded-full font-semibold">Cargando fecha...</span>
                <h2 id="motivation-title" class="text-2xl md:text-3xl font-bold">¡A por un día productivo!</h2>
                <p id="motivation-subtitle" class="text-pulse-100 text-sm">Organiza tus horarios y domina tus pendientes.</p>
            </div>
            <div class="w-full md:w-72 bg-white/10 backdrop-blur-md p-4 rounded-2xl border border-white/20 space-y-2">
                <div class="flex justify-between text-sm font-medium">
                    <span>Progreso del Día</span>
                    <span id="progress-text">0%</span>
                </div>
                <div class="w-full bg-black/20 h-3 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-white h-full transition-all duration-500 rounded-full" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Layout de 2 Columnas: Formulario de Tarea + Lista de Horarios -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Columna 1: Crear / Editar Tarea -->
            <div class="bg-white dark:bg-gray-800 p-6 rounded-3xl border border-gray-200 dark:border-gray-700 shadow-sm space-y-6 h-fit">
                <h3 class="text-lg font-bold flex items-center">
                    <i class="fa-solid fa-circle-plus text-pulse-600 mr-2"></i> Nueva Tarea u Horario
                </h3>
                <form id="taskForm" onsubmit="saveTask(event)" class="space-y-4">
                    <input type="hidden" id="taskId">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Nombre de la Tarea</label>
                        <input type="text" id="taskTitle" placeholder="Ej: Programar módulo web..." required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-pulse-500">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Hora Recomendada</label>
                            <input type="time" id="taskTime" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-pulse-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Prioridad</label>
                            <select id="taskPriority" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-pulse-500">
                                <option value="normal">Normal</option>
                                <option value="importante">Importante</option>
                                <option value="urgente">Urgente</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Categoría</label>
                        <select id="taskCategory" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-pulse-500">
                            <option value="Trabajo / Código">Trabajo / Código</option>
                            <option value="Estudio">Estudio</option>
                            <option value="Personal">Personal</option>
                            <option value="Salud / Deporte">Salud / Deporte</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-pulse-600 hover:bg-pulse-700 text-white font-medium py-3 rounded-xl text-sm transition-colors shadow-sm flex items-center justify-center">
                        <i class="fa-solid fa-plus mr-2"></i> Añadir al Cronograma
                    </button>
                </form>
            </div>

            <!-- Columna 2 y 3: Lista de Tareas Organizadas por Horario -->
            <div class="bg-white dark:bg-gray-800 p-6 rounded-3xl border border-gray-200 dark:border-gray-700 shadow-sm lg:col-span-2 space-y-6">
                <div class="flex flex-col sm:flex-row justify-between items-center gap-4 border-b border-gray-200 dark:border-gray-700 pb-4">
                    <h3 class="text-lg font-bold flex items-center">
                        <i class="fa-solid fa-clock text-pulse-600 mr-2"></i> Cronograma de Hoy
                    </h3>
                    <div class="flex items-center space-x-2 w-full sm:w-auto">
                        <select id="filterStatus" onchange="renderTasks()" class="px-3 py-1.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-xs focus:outline-none">
                            <option value="all">Todas las tareas</option>
                            <option value="pending">Pendientes</option>
                            <option value="completed">Completadas</option>
                        </select>
                    </div>
                </div>

                <!-- Contenedor dinámico de tareas -->
                <div id="tasksContainer" class="space-y-3">
                    <!-- Las tareas se cargan aquí por JavaScript -->
                </div>
            </div>

        </div>
    </main>

    <!-- JavaScript Lógica Inteligente -->
    <script>
        let tasks = JSON.parse(localStorage.getItem('taskpulse_tasks')) || [
            { id: 1, title: 'Revisar código de AdsStock y probar interfaz', time: '09:00', priority: 'urgente', category: 'Trabajo / Código', completed: false },
            { id: 2, title: 'Estudiar conceptos avanzados de JavaScript', time: '11:30', priority: 'importante', category: 'Estudio', completed: false },
            { id: 3, title: 'Entrenamiento físico diario', time: '17:00', priority: 'normal', category: 'Salud / Deporte', completed: true }
        ];

        function init() {
            if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').className = "fa-solid fa-sun text-lg";
            }
            
            // Mostrar fecha actual bonita
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date-display').innerText = new Date().toLocaleDateString('es-ES', options);

            renderTasks();
            updateProgress();
        }

        function toggleDarkMode() {
            const icon = document.getElementById('theme-icon');
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                icon.className = "fa-solid fa-moon text-lg";
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                icon.className = "fa-solid fa-sun text-lg";
            }
        }

        function saveTask(e) {
            e.preventDefault();
            const id = document.getElementById('taskId').value;
            const title = document.getElementById('taskTitle').value;
            const time = document.getElementById('taskTime').value;
            const priority = document.getElementById('taskPriority').value;
            const category = document.getElementById('taskCategory').value;

            if (id) {
                const t = tasks.find(item => item.id == id);
                if (t) {
                    t.title = title;
                    t.time = time;
                    t.priority = priority;
                    t.category = category;
                }
            } else {
                const newTask = {
                    id: Date.now(),
                    title,
                    time,
                    priority,
                    category,
                    completed: false
                };
                tasks.push(newTask);
            }

            // Ordenar automáticamente por horario
            tasks.sort((a, b) => a.time.localeCompare(b.time));

            localStorage.setItem('taskpulse_tasks', JSON.stringify(tasks));
            document.getElementById('taskForm').reset();
            document.getElementById('taskId').value = '';
            renderTasks();
            updateProgress();
        }

        function toggleTaskComplete(id) {
            const t = tasks.find(item => item.id === id);
            if (t) {
                t.completed = !t.completed;
                localStorage.setItem('taskpulse_tasks', JSON.stringify(tasks));
                renderTasks();
                updateProgress();
            }
        }

        function deleteTask(id) {
            if (confirm('¿Eliminar esta tarea del cronograma?')) {
                tasks = tasks.filter(item => item.id !== id);
                localStorage.setItem('taskpulse_tasks', JSON.stringify(tasks));
                renderTasks();
                updateProgress();
            }
        }

        function renderTasks() {
            const container = document.getElementById('tasksContainer');
            const filter = document.getElementById('filterStatus').value;
            container.innerHTML = '';

            const filtered = tasks.filter(t => {
                if (filter === 'pending') return !t.completed;
                if (filter === 'completed') return t.completed;
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-gray-400 text-sm">No hay tareas programadas con este filtro.</div>`;
                return;
            }

            filtered.forEach(t => {
                let badgeColor = 'bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-300';
                if (t.priority === 'urgente') badgeColor = 'bg-rose-100 text-rose-700 dark:bg-rose-900/30 dark:text-rose-400';
                if (t.priority === 'importante') badgeColor = 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400';

                container.innerHTML += `
                    <div class="flex items-center justify-between p-4 rounded-2xl border border-gray-100 dark:border-gray-700/60 bg-gray-50/50 dark:bg-gray-900/30 hover:shadow-md transition-all ${t.completed ? 'opacity-60 bg-gray-100/50 dark:bg-gray-800/20' : ''}">
                        <div class="flex items-center space-x-4">
                            <input type="checkbox" ${t.completed ? 'checked' : ''} onclick="toggleTaskComplete(${t.id})" class="w-5 h-5 accent-pulse-600 rounded cursor-pointer">
                            <div>
                                <div class="flex items-center space-x-2">
                                    <span class="text-xs font-bold px-2 py-0.5 rounded-md bg-pulse-50 dark:bg-pulse-900/40 text-pulse-600 dark:text-pulse-400"><i class="fa-regular fa-clock mr-1"></i>${t.time}</span>
                                    <span class="text-xs font-semibold px-2 py-0.5 rounded-md ${badgeColor} uppercase">${t.priority}</span>
                                </div>
                                <h4 class="text-sm font-semibold mt-1 ${t.completed ? 'line-through text-gray-400' : ''}">${t.title}</h4>
                                <span class="text-xs text-gray-400">${t.category}</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="deleteTask(${t.id})" class="p-2 text-gray-400 hover:text-rose-600 transition-colors"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        function updateProgress() {
            if (tasks.length === 0) {
                document.getElementById('progress-bar').style.width = '0%';
                document.getElementById('progress-text').innerText = '0%';
                document.getElementById('motivation-title').innerText = '¡Día libre de tareas!';
                return;
            }

            const completedCount = tasks.filter(t => t.completed).length;
            const percentage = Math.round((completedCount / tasks.length) * 100);

            document.getElementById('progress-bar').style.width = `${percentage}%`;
            document.getElementById('progress-text').innerText = `${percentage}%`;

            const titleEl = document.getElementById('motivation-title');
            const subEl = document.getElementById('motivation-subtitle');

            if (percentage === 100) {
                titleEl.innerText = '¡Imparable! 🏆';
                subEl.innerText = 'Has completado todas tus metas del día.';
            } else if (percentage >= 50) {
                titleEl.innerText = '¡Vas por la mitad! 🔥';
                subEl.innerText = 'Mantén el ritmo, ya falta menos.';
            } else {
                titleEl.innerText = '¡A por un día productivo! 🚀';
                subEl.innerText = `Tienes ${tasks.length - completedCount} tareas pendientes en tu cronograma.`;
            }
        }

        window.onload = init;
    </script>
</body>
</html>
